Model:
  Name: "Thermal"
  UUID: '9959d007-a970-4ea7-bae4-3eb1b8b883c7'
  URL: ''
  Description: "default thermal model"
  DOI: ""
  SpecificHeat:
    DisplayName: "Specific Heat"
    Type: 'Quantity'
    Units: 'J/kg/K'
    URL: 'https://en.wikipedia.org/wiki/Heat_capacity'
    Description: "Specific capacity in [FreeCAD SpecificHeat unit]"
  ThermalConductivity:
    DisplayName: "Thermal Conductivity"
    Type: 'Quantity'
    Units: 'W/m/K'
    URL: 'https://en.wikipedia.org/wiki/Thermal_conductivity'
    Description: "Thermal conductivity in [FreeCAD ThermalConductivity unit]"
  ThermalExpansionCoefficient:
    DisplayName: "Thermal Expansion Coefficient"
    Type: 'Quantity'
    Units: 'm/m/K'
    URL:
      'https://en.wikipedia.org/wiki/Volumetric_thermal_expansion_coefficient'
    Description: >
      Thermal expansion coefficient (linear) in [FreeCAD
      ThermalExpansionCoefficient unit]
  ThermalExpansionReferenceTemperature:
    DisplayName: "Thermal Expansion Reference Temperature"
    Type: 'Quantity'
    Units: 'K'
    URL: ''
    Description: >
      The reference temperature is the temperature at which zero thermal
      strains exist for the analysis.
